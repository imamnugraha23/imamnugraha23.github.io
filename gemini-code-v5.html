<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Text to HTML Converter (Mobile & Desktop)</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f0f2f5;
            color: #333;
        }
        h1 {
            color: #1a252f;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .box-left {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .box-right {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .output-container {
            display: flex;
            gap: 15px;
        }
        .output-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }
        textarea {
            width: 100%;
            height: 600px;
            padding: 12px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            resize: vertical;
            background-color: #fff;
        }
        /* Custom Highlight Output Box */
        .output-highlight {
            width: 100%;
            height: 540px;
            padding: 12px;
            font-size: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        /* Style Warna Khusus Komentar Section */
        .comment-section {
            color: #6A9955;
            font-weight: bold;
            background-color: #2d3728;
            padding: 2px 6px;
            border-radius: 3px;
            display: inline-block;
            margin: 4px 0;
        }
        .btn-container {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button.btn-copy {
            background-color: #28a745;
            width: 100%;
        }
        button.btn-copy:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <h1>Auto Text to HTML Converter (Dual Version: Mobile & Desktop)</h1>
    
    <div class="container">
        <!-- Input Box -->
        <div class="box-left">
            <label for="inputText">Masukkan Teks Mentah / Artikel:</label>
            <textarea id="inputText" placeholder="Tempelkan teks artikel mentah di sini..."></textarea>
            <div class="btn-container">
                <button onclick="processConversion()">Konversi ke Mobile & Desktop</button>
            </div>
        </div>

        <!-- Output Box Dual Version -->
        <div class="box-right">
            <div class="output-container">
                <!-- Mobile Output -->
                <div class="output-box">
                    <label>Hasil Versi Mobile (16px / 18px):</label>
                    <div id="outputMobile" class="output-highlight"><i>Hasil Mobile akan muncul di sini...</i></div>
                    <div class="btn-container">
                        <button class="btn-copy" onclick="copyToClipboard('mobile')">Salin Output Mobile</button>
                    </div>
                </div>

                <!-- Desktop Output -->
                <div class="output-box">
                    <label>Hasil Versi Desktop (18px / 24px):</label>
                    <div id="outputDesktop" class="output-highlight"><i>Hasil Desktop akan muncul di sini...</i></div>
                    <div class="btn-container">
                        <button class="btn-copy" onclick="copyToClipboard('desktop')">Salin Output Desktop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let rawMobileHTML = "";
        let rawDesktopHTML = "";

        function processConversion() {
            const rawText = document.getElementById('inputText').value;
            const outputMobileDisplay = document.getElementById('outputMobile');
            const outputDesktopDisplay = document.getElementById('outputDesktop');

            if (!rawText.trim()) {
                outputMobileDisplay.innerHTML = "<i>Hasil Mobile akan muncul di sini...</i>";
                outputDesktopDisplay.innerHTML = "<i>Hasil Desktop akan muncul di sini...</i>";
                rawMobileHTML = "";
                rawDesktopHTML = "";
                return;
            }

            // Generate HTML untuk Mobile (Font: 16px / 18px)
            rawMobileHTML = generateHTML(rawText, "16px", "18px");
            
            // Generate HTML untuk Desktop (Font: 18px / 24px)
            rawDesktopHTML = generateHTML(rawText, "18px", "24px");

            // Tampilkan dengan Highlight Komentar Section
            outputMobileDisplay.innerHTML = renderHighlight(rawMobileHTML);
            outputDesktopDisplay.innerHTML = renderHighlight(rawDesktopHTML);
        }

        // Fungsi Generasi HTML Utama berdasarkan Konfigurasi Font
        function generateHTML(rawText, bodyFontSize, headingFontSize) {
            const paragraphs = rawText.split(/\n\s*\n/);
            let resultHTML = "";
            let currentSection = 1;

            paragraphs.forEach((block, idx) => {
                let text = block.trim();
                if (!text) return;

                // 1. Deteksi Khusus Section Link autovm
                if (text.startsWith("Link autovm:") || text.startsWith("Link autovm :")) {
                    resultHTML += `<!-- Section ${currentSection} -->\n${text}\n\n`;
                    currentSection++;
                    return;
                }

                // Komentar Section di awal artikel
                if (idx === 0) {
                    resultHTML += `<!-- Section ${currentSection} -->\n`;
                }

                let lines = text.split('\n').map(l => l.trim()).filter(l => l !== "");

                // 2. Deteksi Judul Utama H1
                if (idx === 0 && lines.length === 1) {
                    let formattedLine = applyFormatters(lines[0]);
                    resultHTML += `<h1 style="text-align: center;"><span style="font-size: ${headingFontSize};"><strong>${formattedLine}</strong></span></h1>\n\n`;
                    currentSection++;
                    return;
                }

                // Memproses baris per baris
                lines.forEach((line) => {
                    // Deteksi H2
                    if (isH2Header(line)) {
                        let formatted = applyFormatters(line);
                        resultHTML += `<h2><span style="font-size: ${headingFontSize};"><strong>${formatted}</strong></span></h2>\n<p><br></p>\n`;
                    }
                    // Deteksi H3 (Point Rekomendasi 1-10)
                    else if (/^\d+\.\s+/.test(line) && line.length < 100) {
                        let formatted = applyFormatters(line);
                        resultHTML += `<h3><span style="font-size: ${bodyFontSize};"><strong>${formatted}</strong></span></h3>\n<p><br></p>\n`;
                    }
                    // Deteksi Tag Gambar
                    else if (/^Link image\s*:\s*/i.test(line)) {
                        let imageName = line.replace(/^Link image\s*:\s*/i, "").trim();
                        let imageUrl = `https://cdn.ruparupa.io/media/tahu-asset/IMAGE_TAHU_${imageName.replace(/\s+/g, '-')}_1785139120.jpeg`;
                        let altText = imageName.replace(/\.[^/.]+$/, "");
                        
                        resultHTML += `<p><img src="${imageUrl}" alt="${altText}" width="300px" style="width: 300px; height: 300px; display: block; margin-left: auto; margin-right: auto;"><br></p>\n`;
                    }
                    // Deteksi Link Produk
                    else if ((line.startsWith("Jual ") || line.startsWith("Sharp ") || line.startsWith("Panasonic ") || line.startsWith("Modena ")) && line.length < 120 && !line.endsWith(".")) {
                        let formatted = applyFormatters(line);
                        resultHTML += `<p style="text-align: center;"><a href="https://www.ruparupa.com/p/example-product.html" style="font-size: ${bodyFontSize};"><strong style="color: rgb(0, 167, 245);"><u>${formatted}</u></strong></a></p>\n<p style="text-align: center;"><br></p>\n`;
                    }
                    // Deteksi Bullet Point (Symbol • atau tanda -)
                    else if (/^[•\-]\s*/.test(line)) {
                        let cleanLine = line.replace(/^[•\-]\s*/, "");
                        let formatted = applyFormatters(cleanLine);

                        if (formatted.includes(":")) {
                            formatted = formatted.replace(/^([^:]+):/, "<strong>- $1:</strong>");
                        } else {
                            formatted = `- ${formatted}`;
                        }

                        resultHTML += `<p><span style="font-size: ${bodyFontSize};">${formatted}</span></p>\n<p><span style="font-size: ${bodyFontSize};"><br></span></p>\n`;
                    }
                    // Paragraf Biasa
                    else {
                        let formatted = applyFormatters(line);
                        resultHTML += `<p><span style="font-size: ${bodyFontSize};">${formatted}</span></p>\n<p><span style="font-size: ${bodyFontSize};"><br></span></p>\n`;
                    }
                });
            });

            // Otomatis bungkus semua tag <a> dengan <strong> jika belum
            resultHTML = resultHTML.replace(/<a([^>]*)>(.*?)<\/a>/gi, function(match, attributes, content) {
                if (!content.includes('<strong>')) {
                    return `<a${attributes}><strong>${content}</strong></a>`;
                }
                return match;
            });

            return resultHTML.trim();
        }

        // Helper memiringkan kata asing
        function applyFormatters(str) {
            const italicWords = [
                "side by side", "french door", "chiller", "freezer", 
                "no frost", "smart control", "deodorizer", "crisper", 
                "counter-depth", "seamless", "smart home", "tempered glass",
                "black glass", "matte", "supermarket", "watt", "touchless", "heated seat"
            ];

            let result = str;
            italicWords.forEach(word => {
                let regex = new RegExp(`\\b(${word})\\b`, 'gi');
                result = result.replace(regex, "<em>$1</em>");
            });

            return result;
        }

        // Helper deteksi H2
        function isH2Header(str) {
            if (str.endsWith('?') && str.length < 90) return true;
            if (str.startsWith("Tips Memilih") || str.startsWith("Kesalahan yang Sering") || str.startsWith("FAQ Seputar") || str.startsWith("Pilih Kulkas") || str.startsWith("Perbedaan Kulkas")) return true;
            if (str.startsWith("Kenapa Kulkas") || str.startsWith("Berapa Kapasitas") || str.startsWith("Berapa Konsumsi")) return true;
            return false;
        }

        // Function Highlight UI
        function renderHighlight(htmlText) {
            return escapeHTML(htmlText).replace(
                /&lt;!-- (Section \d+) --&gt;/g, 
                '<span class="comment-section">&lt;!-- $1 --&gt;</span>'
            );
        }

        // Escape tag HTML
        function escapeHTML(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        // Fungsi Salin Spesifik (Mobile / Desktop)
        function copyToClipboard(type) {
            const textToCopy = (type === 'mobile') ? rawMobileHTML : rawDesktopHTML;
            if (!textToCopy) return;
            
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            alert(`Kode HTML Versi ${type.toUpperCase()} berhasil disalin!`);
        }
    </script>

</body>
</html>
